<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog Produk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/assets/css/style.css">
</head>
<body>

  <header>
    <div class="wrap bar">
      <div class="brand" id="storeName">Toko Berkah</div>
      <div class="search">
        <label class="sr" for="q">Cari produk</label>
        <input id="q" type="search" placeholder="Cari produk" autocomplete="off">
      </div>
      <button class="cart-btn" id="cartBtn" type="button" aria-label="Buka keranjang">Keranjang<span class="count" id="cartCount" hidden>0</span></button>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Kategori"></div>
      <label>
        <span class="sr">Urutkan</span>
        <select id="sort">
          <option value="new">Terbaru</option>
          <option value="low">Harga terendah</option>
          <option value="high">Harga tertinggi</option>
          <option value="name">Nama A-Z</option>
        </select>
      </label>
    </div>
    <div class="result-info" id="info" aria-live="polite"></div>
    <section class="grid" id="grid" aria-busy="true"></section>
  </main>

  <dialog id="detail" aria-label="Detail produk">
    <button class="d-close" type="button" data-close aria-label="Tutup">&times;</button>
    <div id="detailBody"></div>
  </dialog>

  <dialog id="cart" aria-label="Keranjang belanja">
    <div class="c-head">
      <h2>Keranjang</h2>
      <button class="c-close" type="button" data-close aria-label="Tutup">&times;</button>
    </div>
    <div id="cartNotices"></div>
    <ul class="c-list" id="cartItems"></ul>
    <div class="c-foot" id="cartFoot"></div>
  </dialog>

  <dialog id="checkout" aria-label="Checkout pesanan">
    <div class="c-head">
      <h2>Checkout</h2>
      <button class="c-close" type="button" data-close aria-label="Tutup">&times;</button>
    </div>
    <div id="checkoutBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
