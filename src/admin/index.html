<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login Admin | Katalog Toko</title>
  <style>
    :root {
      --bg: #f3f7f4;
      --surface: #ffffff;
      --ink: #14251d;
      --muted: #5d6b63;
      --line: #dbe6df;
      --accent: #0e6b4d;
      --accent-strong: #0a5139;
      --danger: #bb2d3b;
      --shadow: 0 18px 40px rgba(15, 36, 29, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #edf5ef 0%, #f9faf9 100%);
      color: var(--ink);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    .login-shell {
      width: min(92vw, 440px);
      padding: 24px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 30px 24px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.1;
    }

    .lead {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      font-weight: 600;
      color: var(--ink);
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 48px;
      padding: 0 14px;
      font: inherit;
      background: #f9fbfa;
    }

    input:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(14, 107, 77, 0.15);
      background: var(--surface);
    }

    button {
      border: none;
      border-radius: 12px;
      min-height: 48px;
      padding: 0 16px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--accent-strong);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .message {
      min-height: 24px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .message.error {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-label="Form login admin">
      <p class="eyebrow">Area admin</p>
      <h1>Masuk panel admin</h1>
      <p class="lead">Gunakan akun Supabase Auth Anda untuk mengelola katalog dan pengaturan toko.</p>

      <form id="admin-login-form" novalidate>
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" placeholder="admin@toko.com" required>
        </label>

        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
        </label>

        <button id="login-submit" type="submit">Masuk</button>
      </form>

      <p id="login-message" class="message" role="alert" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="./js/admin-login.js"></script>
</body>
</html>
