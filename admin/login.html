<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Masuk | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/assets/css/style.css">
  <link rel="stylesheet" href="/src/admin/css/admin.css">
</head>
<body>
  <main class="ad-login">
    <form class="ad-card" id="loginForm" novalidate>
      <div>
        <h1>Masuk admin</h1>
        <p class="ad-sub"><span id="loginBrand">Toko</span> &middot; hanya untuk penjual</p>
      </div>
      <p class="ad-info" id="loginInfo" role="status" hidden></p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="ad-pw">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="togglePw" aria-pressed="false">Tampilkan</button>
        </div>
      </div>
      <label class="ad-check"><input type="checkbox" name="remember"> Ingat saya di perangkat ini</label>
      <p class="ad-err" id="loginError" role="alert" hidden></p>
      <button class="add" id="loginBtn" type="submit">Masuk</button>
    </form>
  </main>
  <script type="module" src="/src/admin/js/login.js"></script>
</body>
</html>
